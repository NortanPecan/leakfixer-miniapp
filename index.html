<!DOCTYPE html>
<html>
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen p-4 text-white">
  <div id="app" class="max-w-md mx-auto">
    <!-- Главный экран -->
    <div id="main" class="space-y-6">
      <h1 class="text-3xl font-bold text-center">LeakFixer</h1>
      
      <!-- Профиль -->
      <div id="profile" class="flex items-center mb-4">
        <img id="profilePhoto" class="w-14 h-14 rounded-full mr-3 border border-white/50" src="" alt="avatar">
        <div>
          <div id="profileName" class="font-semibold text-lg"></div>
          <div class="text-sm opacity-80">@<span id="profileUsername"></span></div>
        </div>
      </div>

      <!-- Привычки -->
      <div id="profileHabits" class="grid grid-cols-2 gap-3 mb-6">
        <!-- сюда JS подставит карточки привычек -->
      </div>
      
      <div class="bg-white/20 backdrop-blur-xl rounded-2xl p-6">
        <div class="text-4xl font-black text-center mb-4" id="currentDay">День 1</div>
        <div class="grid grid-cols-2 gap-4 text-xl">
          <div>Стрик: <span id="streak">0</span></div>
          <div>Баллы: <span id="points">0</span></div>
        </div>
      </div>

      <div id="lesson" class="bg-white/10 rounded-xl p-6">
        <h2 id="lessonTitle" class="text-xl font-semibold mb-2"></h2>
        <p id="lessonDesc" class="mb-4 opacity-90"></p>
        <iframe id="video" class="w-full h-48 rounded-lg" style="display:none"></iframe>
        <button id="completeBtn" class="w-full bg-green-500 hover:bg-green-600 py-3 rounded-xl font-semibold text-lg">
          ✅ Выполнено
        </button>
      </div>

      <div class="flex space-x-3">
        <button id="habitsBtn" class="flex-1 bg-blue-500 hover:bg-blue-600 py-3 rounded-xl font-semibold">📊 Привычки</button>
        <button id="buddyBtn" class="flex-1 bg-purple-500 hover:bg-purple-600 py-3 rounded-xl font-semibold">👥 Бадди</button>
      </div>
    </div>

    <!-- Экран Бадди -->
    <div id="buddyScreen" class="hidden space-y-6">
      <button id="backBtn" class="text-2xl">←</button>
      <div class="bg-white/20 backdrop-blur-xl rounded-2xl p-6 text-center">
        <h2 class="text-2xl font-bold mb-4">Выбери напарника</h2>
        <input id="buddyInput" placeholder="@username" class="w-full p-3 bg-white/30 rounded-xl text-white placeholder-white/70">
        <button id="addBuddy" class="w-full mt-4 bg-pink-500 hover:bg-pink-600 py-3 rounded-xl font-semibold">Добавить</button>
      </div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
